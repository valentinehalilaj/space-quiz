<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <title>Orbit Quiz — A little space adventure</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --page: #f5f4fb;
      --surface: #fff;
      --surface-soft: #f7f6fc;
      --ink: #17172a;
      --muted: #77768d;
      --line: #e9e7f1;
      --accent: #7357e8;
      --accent-soft: #f0edff;
      --green: #17865f;
      --green-soft: #e8f8f0;
      --red: #d34b60;
      --red-soft: #fff0f1;
      --console: #147d78;
      --console-soft: #e7f6f3;
      --console-grid: rgb(20 125 120 / 5%);
      --shadow: 0 24px 70px rgb(34 25 75 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101326;
        --surface: #191c32;
        --surface-soft: #20233b;
        --ink: #f4f3fc;
        --muted: #aaa9c1;
        --line: #30334c;
        --accent: #a795ff;
        --accent-soft: #302b4d;
        --green: #75e0b2;
        --green-soft: #173c36;
        --red: #ff91a0;
        --red-soft: #482734;
        --console: #74d8ca;
        --console-soft: #1b3b40;
        --console-grid: rgb(116 216 202 / 5%);
        --shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 10%, rgb(142 116 255 / 13%), transparent 34%),
        radial-gradient(ellipse at 92% 88%, rgb(66 204 190 / 10%), transparent 30%),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
    }

    button { font: inherit; }

    .quiz {
      position: relative;
      width: min(100%, 520px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .quiz::before {
      position: absolute;
      z-index: 1;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--console), var(--accent), #e3b454);
      content: "";
    }

    .topbar {
      min-height: 76px;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(110deg, var(--console-soft), var(--surface) 44%);
    }

    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .brand-copy { display: grid; gap: 1px; }

    .brand-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--console);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .09em;
      line-height: 1.4;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--console);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--console) 16%, transparent);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--console) 25%, var(--line));
      border-radius: 10px;
      background: var(--console-soft);
      font-size: 19px;
    }

    .score-pill {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
      font-weight: 650;
    }

    .score-pill strong { color: var(--ink); }

    .content {
      padding: 30px 32px 32px;
      background-image:
        linear-gradient(var(--console-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--console-grid) 1px, transparent 1px);
      background-position: top right;
      background-size: 24px 24px;
      background-repeat: no-repeat;
    }

    .progress-meta {
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      background: linear-gradient(90deg, var(--console), var(--accent));
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .eyebrow {
      margin: 28px 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.2;
      letter-spacing: -.045em;
    }

    .description {
      margin: 11px 0 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 58px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--surface-soft);
    }

    .answer:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-key {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .answer-copy { flex: 1; font-size: 14px; font-weight: 560; }

    .answer-icon {
      width: 21px;
      text-align: center;
      font-weight: 800;
    }

    .answer.correct {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-soft);
      animation: pop-in 300ms ease both;
    }

    .answer.correct .answer-key {
      border-color: transparent;
      color: var(--green);
      background: color-mix(in srgb, var(--green) 12%, transparent);
    }

    .answer.wrong {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
      animation: shake 380ms ease both;
    }

    .answer.wrong .answer-key {
      border-color: transparent;
      color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, transparent);
    }

    .feedback {
      min-height: 26px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .actions {
      min-height: 48px;
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    .next-button, .restart-button {
      min-height: 46px;
      padding: 0 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #7357e8;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .next-button:hover, .restart-button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .next-button[hidden] { display: none; }

    .results {
      padding: 43px 32px 39px;
      text-align: center;
    }

    .results[hidden], .quiz-content[hidden] { display: none; }

    .result-emoji {
      width: 90px;
      height: 90px;
      margin: 0 auto 21px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: var(--accent-soft);
      font-size: 48px;
      animation: pop-in 450ms cubic-bezier(.2,.8,.2,1) both;
    }

    .results h1 { font-size: 30px; }
    .results .description { max-width: 350px; margin: 12px auto 24px; }

    .final-score {
      width: fit-content;
      margin: 0 auto 25px;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      background: var(--surface-soft);
    }

    .final-score strong { color: var(--ink); font-size: 20px; }
    .results .restart-button { min-width: 155px; }

    .footer-note {
      padding: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-5px); }
      30%, 60%, 90% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    @keyframes pop-in {
      from { transform: scale(.96); opacity: .65; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      .quiz { border-radius: 16px; }
      .topbar { min-height: 68px; padding: 15px 19px; }
      .content { padding: 24px 20px 23px; }
      .results { padding: 36px 22px 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-label="Space exploration quiz">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🪐</span>
        <span class="brand-copy">
          <span>Orbit Quiz</span>
          <span class="brand-status"><span class="status-light" aria-hidden="true"></span>MISSION ACTIVE</span>
        </span>
      </div>
      <div class="score-pill" aria-live="polite">⭐ Score <strong id="score">0</strong></div>
    </header>

    <section class="quiz-content" id="quizContent">
      <div class="content">
        <div class="progress-meta">
          <span id="questionCounter">Question 1 of 10</span>
          <span id="progressPercent">10%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <p class="eyebrow" id="category">The solar system</p>
        <h1 id="question" tabindex="-1">Loading your first question…</h1>
        <p class="description">Choose the best answer to continue your cosmic journey.</p>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="actions">
          <button class="next-button" id="nextButton" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <section class="results" id="results" hidden aria-live="polite">
      <div class="result-emoji" id="resultEmoji" aria-hidden="true">🚀</div>
      <p class="eyebrow">Mission complete</p>
      <h1 id="resultTitle">Stellar work!</h1>
      <p class="description" id="resultMessage"></p>
      <div class="final-score">Your score <strong id="finalScore">0 / 10</strong></div>
      <button class="restart-button" id="restartButton" type="button">Play again <span aria-hidden="true">↻</span></button>
    </section>

    <div class="footer-note" id="footerNote">A tiny trip through the universe ✨</div>
  </main>

  <script>
    const questions = [
      {
        category: "The solar system",
        question: "Which planet is known as the Red Planet?",
        options: ["Venus", "Mars", "Jupiter", "Mercury"],
        answer: 1,
        fact: "Mars gets its rusty-red color from iron-rich dust on its surface."
      },
      {
        category: "Our star",
        question: "What is the Sun mostly made of?",
        options: ["Liquid lava", "Oxygen and nitrogen", "Hydrogen and helium", "Rock and metal"],
        answer: 2,
        fact: "The Sun is a giant ball of plasma, made mostly of hydrogen and helium."
      },
      {
        category: "Moon missions",
        question: "Who was the first person to walk on the Moon?",
        options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"],
        answer: 2,
        fact: "Neil Armstrong stepped onto the lunar surface on July 20, 1969."
      },
      {
        category: "The solar system",
        question: "Which planet has the most prominent ring system?",
        options: ["Saturn", "Neptune", "Earth", "Mars"],
        answer: 0,
        fact: "Saturn's rings are made mostly of countless pieces of ice and rock."
      },
      {
        category: "Deep space",
        question: "What is the name of our galaxy?",
        options: ["Andromeda", "The Milky Way", "Whirlpool", "Sombrero"],
        answer: 1,
        fact: "Our solar system lives in the Milky Way, a barred spiral galaxy."
      },
      {
        category: "Space science",
        question: "What force keeps planets in orbit around the Sun?",
        options: ["Magnetism", "Friction", "Gravity", "Solar wind"],
        answer: 2,
        fact: "The Sun's gravity pulls on the planets and keeps them moving in orbit."
      },
      {
        category: "The solar system",
        question: "Which planet is the largest in our solar system?",
        options: ["Earth", "Saturn", "Neptune", "Jupiter"],
        answer: 3,
        fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
      },
      {
        category: "Moon missions",
        question: "What is the name of NASA's famous space telescope launched in 1990?",
        options: ["Hubble Space Telescope", "Kepler Observatory", "Voyager Telescope", "Apollo Scope"],
        answer: 0,
        fact: "The Hubble Space Telescope has transformed our view of the universe since 1990."
      },
      {
        category: "Cosmic wonders",
        question: "What is a light-year a measure of?",
        options: ["Time", "Brightness", "Distance", "Speed"],
        answer: 2,
        fact: "A light-year is the distance light travels in one year—about 9.5 trillion km."
      },
      {
        category: "Space science",
        question: "Which planet rotates on its side?",
        options: ["Uranus", "Mercury", "Venus", "Earth"],
        answer: 0,
        fact: "Uranus is tilted by about 98 degrees, making it look like it spins on its side."
      }
    ];

    const scoreEl = document.getElementById("score");
    const questionCounter = document.getElementById("questionCounter");
    const progressPercent = document.getElementById("progressPercent");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const categoryEl = document.getElementById("category");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const feedbackEl = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const quizContent = document.getElementById("quizContent");
    const results = document.getElementById("results");
    const footerNote = document.getElementById("footerNote");
    let questionIndex = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const current = questions[questionIndex];
      answered = false;
      questionCounter.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
      progressPercent.textContent = `${Math.round(((questionIndex + 1) / questions.length) * 100)}%`;
      progressFill.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      progressBar.setAttribute("aria-valuenow", String(questionIndex + 1));
      categoryEl.textContent = current.category;
      questionEl.textContent = current.question;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      nextButton.hidden = true;
      nextButton.innerHTML = questionIndex === questions.length - 1
        ? 'See my results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      answersEl.replaceChildren();

      current.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = `<span class="answer-key">${String.fromCharCode(65 + index)}</span><span class="answer-copy"></span><span class="answer-icon" aria-hidden="true"></span>`;
        button.querySelector(".answer-copy").textContent = option;
        button.addEventListener("click", () => selectAnswer(index));
        answersEl.append(button);
      });
    }

    function selectAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const current = questions[questionIndex];
      const buttons = [...answersEl.querySelectorAll(".answer")];
      buttons.forEach(button => { button.disabled = true; });

      if (selectedIndex === current.answer) {
        score += 1;
        scoreEl.textContent = String(score);
        buttons[selectedIndex].classList.add("correct");
        buttons[selectedIndex].querySelector(".answer-icon").textContent = "✓";
        feedbackEl.textContent = `Brilliant! ${current.fact}`;
        feedbackEl.classList.add("good");
      } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[selectedIndex].querySelector(".answer-icon").textContent = "×";
        buttons[current.answer].classList.add("correct");
        buttons[current.answer].querySelector(".answer-icon").textContent = "✓";
        feedbackEl.textContent = `Not quite! ${current.fact}`;
        feedbackEl.classList.add("bad");
      }

      nextButton.hidden = false;
      nextButton.focus({ preventScroll: true });
    }

    function showResults() {
      quizContent.hidden = true;
      results.hidden = false;
      footerNote.textContent = "Thanks for exploring with us, space ranger ✨";
      document.querySelector(".score-pill").setAttribute("aria-label", `Final score: ${score} out of ${questions.length}`);
      document.getElementById("finalScore").textContent = `${score} / ${questions.length}`;

      let emoji = "🚀";
      let title = "A great first flight!";
      let message = "You made it through the cosmos. Every great explorer starts with a curious question.";
      if (score >= 9) {
        emoji = "🏆";
        title = "Out of this world!";
        message = "The universe has no secrets from you. That was a truly stellar mission!";
      } else if (score >= 7) {
        emoji = "🌟";
        title = "Stellar work!";
        message = "You know your way around the cosmos. Keep reaching for the stars!";
      } else if (score >= 4) {
        emoji = "🪐";
        title = "Nice orbit!";
        message = "You discovered some cosmic gems. There is always more of the universe to explore!";
      }
      document.getElementById("resultEmoji").textContent = emoji;
      document.getElementById("resultTitle").textContent = title;
      document.getElementById("resultMessage").textContent = message;
      document.getElementById("restartButton").focus({ preventScroll: true });
    }

    nextButton.addEventListener("click", () => {
      if (questionIndex === questions.length - 1) {
        showResults();
        return;
      }
      questionIndex += 1;
      renderQuestion();
      questionEl.focus?.({ preventScroll: true });
    });

    document.getElementById("restartButton").addEventListener("click", () => {
      questionIndex = 0;
      score = 0;
      scoreEl.textContent = "0";
      quizContent.hidden = false;
      results.hidden = true;
      footerNote.textContent = "A tiny trip through the universe ✨";
      document.querySelector(".score-pill").setAttribute("aria-label", "Quiz score");
      renderQuestion();
      answersEl.querySelector("button")?.focus({ preventScroll: true });
    });

    renderQuestion();
  </script>
</body>
</html>
